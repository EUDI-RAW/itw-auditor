name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: Default backend URL embedded in the app (optional)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.ITWATT_KEYSTORE_BASE64 != '' }}
      SERVER_URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug

      # With the keystore secrets the release APK is signed with a stable certificate, whose digest
      # is configured on the backend (ANDROID_SIGNATURE_DIGESTS). Without them only the debug APK is
      # built, signed with a debug keystore generated by the runner: its digest changes at every run.
      - name: Build the release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ITWATT_KEYSTORE_BASE64 }}
          ITWATT_KEYSTORE_PASSWORD: ${{ secrets.ITWATT_KEYSTORE_PASSWORD }}
          ITWATT_KEY_ALIAS: ${{ secrets.ITWATT_KEY_ALIAS }}
          ITWATT_KEY_PASSWORD: ${{ secrets.ITWATT_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ITWATT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease \
            -Pitwattauditor.serverUrl="$SERVER_URL"
          rm "$RUNNER_TEMP/release.jks"

      - name: Build the debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew assembleDebug -Pitwattauditor.serverUrl="$SERVER_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: itwattauditor-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
